<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>WoonKyong</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1d1d1f;
      --ink-muted-80: #333333;
      --canvas: #ffffff;
      --canvas-parchment: #f5f5f7;
      --surface-tile-1: #272729;
      --surface-tile-2: #2a2a2c;
      --hairline: #e0e0e0;
      --primary: #0066cc;
      --primary-on-dark: #2997ff;
      --rounded-sm: 8px;
      --rounded-lg: 18px;
      --rounded-pill: 9999px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100dvh;
    }

    header {
      background: #000000;
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-title {
      color: var(--canvas);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.022em;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    .hero-tile {
      background: var(--canvas);
      padding: 80px 20px 64px;
      text-align: center;
    }
    .hero-tile h1 {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.0374px;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    .hero-tile p {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.231px;
      color: var(--ink);
    }

    .category-section {
      padding: 0 20px 80px;
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 40px;
    }

    .category-card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--rounded-lg);
      padding: 24px;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .category-card:hover { transform: translateY(-2px); }
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--rounded-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--primary);
      color: #fff;
    }
    .card-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.374px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--ink-muted-80);
      line-height: 1.5;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-link {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--rounded-lg);
      padding: 20px;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s;
    }
    .item-link:hover { background: var(--canvas-parchment); }
    .item-emoji { font-size: 24px; }
    .item-info { flex: 1; }
    .item-name { font-size: 17px; font-weight: 600; letter-spacing: -0.374px; }
    .item-desc { font-size: 14px; color: var(--ink-muted-80); margin-top: 2px; }

    footer {
      background: var(--canvas-parchment);
      padding: 64px 20px;
      font-size: 12px;
      color: var(--ink-muted-80);
    }

    @media (max-width: 833px) {
      .categories { grid-template-columns: 1fr; }
      .hero-tile { padding: 48px 20px 32px; }
    }
  </style>
</head>
<body>

<header>
  <div class="site-title">WoonKyong</div>
</header>

<main>
  <section class="hero-tile">
    <h1>안녕하세요</h1>
    <p>카테고리를 선택하세요</p>
  </section>

  <section class="category-section">
    <div class="categories">
      <a class="category-card" href="./travel-matsuyama-2026.html">
        <div class="card-icon">✈️</div>
        <div class="card-name">여행</div>
        <div class="card-desc">여행 관련 도구 및 정보</div>
      </a>

      <a class="category-card" href="#finance">
        <div class="card-icon">💰</div>
        <div class="card-name">금융</div>
        <div class="card-desc">금융 계산 및 관리 도구</div>
      </a>

      <a class="category-card" href="./english-vocab.html">
        <div class="card-icon">📚</div>
        <div class="card-name">영어</div>
        <div class="card-desc">영어 학습 도구</div>
      </a>

      <a class="category-card" href="./study-principles.html">
        <div class="card-icon">🛠️</div>
        <div class="card-name">기타</div>
        <div class="card-desc">그 외 유용한 도구들</div>
      </a>
    </div>
  </section>
</main>

<footer>© 2026 WoonKyong</footer>

</body>
</html>
